version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: richeng-postgres
    environment:
      POSTGRES_USER: richeng
      POSTGRES_PASSWORD: richeng123
      POSTGRES_DB: richeng
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: richeng-redis
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: richeng-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: richeng
      RABBITMQ_DEFAULT_PASS: richeng123
    restart: always

volumes:
  pgdata:
